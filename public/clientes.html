<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fijas de Élite · Clientes</title><link rel="stylesheet" href="/style.css"></head><body><header><span class="brand">◆ FIJAS DE <b>ÉLITE</b></span><a href="/">Inicio</a></header><main><section class="card"><h1>Crear cuenta</h1><form id="register"><label>Nombre<input name="display_name" required minlength="2"></label><label>Correo<input name="email" type="email" required></label><label>Contraseña (mínimo 12 caracteres)<input name="password" type="password" minlength="12" required></label><button>Registrarme</button></form><p id="regMsg"></p></section><section class="card"><h2>Entrar como cliente</h2><form id="signin"><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" required></label><button>Iniciar sesión</button></form><p id="loginMsg"></p></section><section class="card"><h2>Solicitar membresía VIP</h2><p>Primero paga por el medio acordado con el administrador y verifica el destinatario. Esta web NO cobra ni valida pagos automáticamente.</p><form id="request"><label>Plan<select name="plan_id" id="plans" required></select></label><label>Método<select name="method"><option value="yape">Yape</option><option value="plin">Plin</option><option value="direct">Transferencia / directo</option></select></label><label>Código de operación / referencia<input name="reference" required minlength="4" maxlength="190"></label><button>Enviar solicitud (no confirma pago)</button></form><p id="requestMsg"></p><h3>Mis membresías</h3><div id="memberships"></div></section></main><script src="/clientes.js" defer></script></body></html>
